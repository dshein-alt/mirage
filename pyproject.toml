[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mirage"
version = "1.1.0"
description = "Mirage persistent local image generation with stable-diffusion.cpp"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn==0.54.0",
  "pillow==13.0.0"
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "httpx==0.28.1"
]

[project.scripts]
mirage = "mirage.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
