[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sd-workbench"
version = "1.0.0"
description = "Persistent local stable-diffusion.cpp workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.121.2",
  "uvicorn==0.38.0",
  "pillow==12.0.0"
]

[dependency-groups]
dev = [
  "pytest==9.0.1",
  "httpx==0.28.1"
]

[project.scripts]
sdwb = "sd_workbench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
